<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CK Sans Editor</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2.2/clipper.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#eee; font-family:system-ui,sans-serif; overflow-x:hidden; }
#canvas-wrap { width:100%; border-bottom:1px solid #333; position:relative; }
canvas { display:block; width:100%; }
.controls { padding:16px; display:flex; flex-direction:column; gap:10px; max-width:800px; }
.row { display:flex; align-items:center; gap:8px; }
.row label { font-size:11px; color:#888; min-width:72px; text-transform:uppercase; letter-spacing:.05em; }
.row input[type=range] { flex:1; accent-color:#0f0; }
.row .val { font-size:11px; color:#0f0; min-width:36px; text-align:right; font-variant-numeric:tabular-nums; }
select { background:#222; color:#eee; border:1px solid #444; padding:6px 8px; border-radius:4px; font-size:13px; flex:1; }
input[type=text] { background:#222; color:#eee; border:1px solid #444; padding:6px 8px; border-radius:4px; font-size:14px; flex:1; }
.sep { height:1px; background:#333; }
button { background:#0f0; color:#111; border:none; padding:12px; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; }
button:active { opacity:.8; }
.sl { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:.1em; }
#info { position:absolute; top:4px; left:6px; font:9px monospace; color:#444; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="cv"></canvas>
  <div id="info"></div>
</div>
<div class="controls">
  <div class="row">
    <input type="text" id="previewText" value="CONDENSED KIWI">
  </div>
  <div class="row">
    <label>Size</label>
    <input type="range" id="fontSize" min="20" max="200" value="80">
    <span class="val" id="fontSizeVal">80</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Transform</div>

  <div class="row">
    <label>Width %</label>
    <input type="range" id="scaleX" min="50" max="150" value="100" step="1">
    <span class="val" id="scaleXVal">100</span>
  </div>
  <div class="row">
    <label>Height %</label>
    <input type="range" id="scaleY" min="50" max="150" value="100" step="1">
    <span class="val" id="scaleYVal">100</span>
  </div>
  <div class="row">
    <label>Fill counter</label>
    <select id="fillCounter">
      <option value="off">Off</option>
      <option value="on">On (fill O, D, etc.)</option>
    </select>
  </div>

  <div class="sep"></div>
  <div class="sl">Stroke</div>

  <div class="row">
    <label>Thickness</label>
    <input type="range" id="thickness" min="-50" max="50" value="0" step="1">
    <span class="val" id="thicknessVal">0</span>
  </div>
  <div class="row">
    <label>Inline</label>
    <input type="range" id="inlineDepth" min="0" max="80" value="0" step="1">
    <span class="val" id="inlineDepthVal">0</span>
  </div>
  <div class="row">
    <label>Corner R</label>
    <input type="range" id="cornerR" min="0" max="60" value="0" step="1">
    <span class="val" id="cornerRVal">0</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Cut Effect</div>

  <div class="row">
    <label>Direction</label>
    <select id="cutDir">
      <option value="none">None</option>
      <option value="vertical">Vertical</option>
      <option value="horizontal">Horizontal</option>
      <option value="grid">Grid</option>
    </select>
  </div>
  <div class="row">
    <label>Width</label>
    <input type="range" id="cutWidth" min="1" max="80" value="12">
    <span class="val" id="cutWidthVal">12</span>
  </div>
  <div class="row">
    <label>Spacing</label>
    <input type="range" id="cutSpacing" min="10" max="200" value="70">
    <span class="val" id="cutSpacingVal">70</span>
  </div>
  <div class="row">
    <label>Offset</label>
    <input type="range" id="cutOffset" min="0" max="100" value="0">
    <span class="val" id="cutOffsetVal">0</span>
  </div>

  <div class="sep"></div>
  <button id="exportBtn">Export .otf</button>
</div>

<script>
// ═══════════════════════════════════════════
//  CK Sans Editor — Clean rewrite
// ═══════════════════════════════════════════

let glyphData = null;

// ─── UI Helpers ───

const $ = id => document.getElementById(id);
const val = id => +$(id).value;

function getParams() {
  return {
    text:        $('previewText').value || 'A',
    fontSize:    val('fontSize'),
    scaleX:      val('scaleX') / 100,
    scaleY:      val('scaleY') / 100,
    fillCounter: $('fillCounter').value === 'on',
    thickness:   val('thickness'),
    inlineDepth: val('inlineDepth'),
    cornerR:     val('cornerR'),
    cutDir:      $('cutDir').value,
    cutWidth:    val('cutWidth'),
    cutSpacing:  val('cutSpacing'),
    cutOffset:   val('cutOffset'),
  };
}

// Sync range labels
document.querySelectorAll('input[type=range]').forEach(el => {
  const v = $(el.id + 'Val');
  if (v) el.addEventListener('input', () => v.textContent = el.value);
});


// ═══════════════════════════════════════════
//  Clipper Offset — 와인딩 방향 정확히 처리
// ═══════════════════════════════════════════
//
//  폰트 컨투어 규칙 (TrueType):
//    외곽(outer) = CW = 음수 signed area
//    카운터(hole) = CCW = 양수 signed area
//
//  Clipper 규칙:
//    외곽 = CCW (Orientation=true)
//    hole = CW  (Orientation=false)
//
//  → 입력 시 reverse, 출력 시 reverse

function clipperOffset(paths, dist) {
  if (dist === 0 || !paths.length) return paths.map(p => p.map(pt => [pt[0], pt[1]]));

  const SCALE = 1; // 폰트 좌표가 이미 정수 단위이므로 스케일 불필요

  try {
    const co = new ClipperLib.ClipperOffset();
    co.MiterLimit = 2;
    co.ArcTolerance = 5;

    for (const poly of paths) {
      if (poly.length < 3) continue;
      // 폰트→Clipper: 와인딩 반전
      const cp = [];
      for (let i = poly.length - 1; i >= 0; i--) {
        cp.push({ X: Math.round(poly[i][0] * SCALE), Y: Math.round(poly[i][1] * SCALE) });
      }
      co.AddPath(cp, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
    }

    const solution = new ClipperLib.Paths();
    co.Execute(solution, dist * SCALE);

    if (solution.length === 0) return paths.map(p => p.map(pt => [pt[0], pt[1]]));

    // Clipper→폰트: 와인딩 반전
    const result = [];
    for (const sp of solution) {
      if (sp.length < 3) continue;
      const pts = [];
      for (let i = sp.length - 1; i >= 0; i--) {
        pts.push([sp[i].X / SCALE, sp[i].Y / SCALE]);
      }
      result.push(pts);
    }
    return result.length > 0 ? result : paths.map(p => p.map(pt => [pt[0], pt[1]]));
  } catch (e) {
    console.warn('Clipper offset failed:', e);
    return paths.map(p => p.map(pt => [pt[0], pt[1]]));
  }
}


// ═══════════════════════════════════════════
//  Corner Rounding (Quadratic Bézier)
// ═══════════════════════════════════════════

function roundCorners(poly, radius) {
  if (radius <= 0 || poly.length < 3) return poly;
  const n = poly.length;
  const out = [];
  const STEPS = 5;

  for (let i = 0; i < n; i++) {
    const prev = poly[(i - 1 + n) % n];
    const curr = poly[i];
    const next = poly[(i + 1) % n];

    const dx1 = prev[0] - curr[0], dy1 = prev[1] - curr[1];
    const dx2 = next[0] - curr[0], dy2 = next[1] - curr[1];
    const len1 = Math.hypot(dx1, dy1);
    const len2 = Math.hypot(dx2, dy2);

    if (len1 < 1 || len2 < 1) { out.push([curr[0], curr[1]]); continue; }

    const r = Math.min(radius, len1 * 0.4, len2 * 0.4);
    const ux1 = dx1 / len1, uy1 = dy1 / len1;
    const ux2 = dx2 / len2, uy2 = dy2 / len2;
    const p0 = [curr[0] + ux1 * r, curr[1] + uy1 * r];
    const p2 = [curr[0] + ux2 * r, curr[1] + uy2 * r];

    for (let s = 0; s <= STEPS; s++) {
      const t = s / STEPS, mt = 1 - t;
      out.push([
        mt * mt * p0[0] + 2 * mt * t * curr[0] + t * t * p2[0],
        mt * mt * p0[1] + 2 * mt * t * curr[1] + t * t * p2[1],
      ]);
    }
  }
  return out;
}


// ═══════════════════════════════════════════
//  Polygon Clipping (Sutherland-Hodgman)
// ═══════════════════════════════════════════

function clipPolyAxis(poly, axis, lo, hi) {
  // axis: 0=x, 1=y
  let p = poly;
  // clip >= lo
  p = clipHalf(p, axis, lo, true);
  // clip <= hi
  p = clipHalf(p, axis, hi, false);
  return p;
}

function clipHalf(poly, axis, val, keepAbove) {
  if (poly.length < 3) return [];
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i + 1) % poly.length];
    const ci = keepAbove ? c[axis] >= val : c[axis] <= val;
    const ni = keepAbove ? n[axis] >= val : n[axis] <= val;
    if (ci) out.push(c);
    if (ci !== ni) {
      const t = (val - c[axis]) / (n[axis] - c[axis]);
      if (axis === 0) out.push([val, c[1] + t * (n[1] - c[1])]);
      else            out.push([c[0] + t * (n[0] - c[0]), val]);
    }
  }
  return out;
}


// ═══════════════════════════════════════════
//  Cut Effect
// ═══════════════════════════════════════════

function applyCuts(paths, axis, lo, hi, cutW, cutSpacing, cutOff) {
  // Build solid strips (gaps = cuts)
  const strips = [];
  let pos = lo + cutOff;
  let solidStart = lo;
  while (pos < hi) {
    if (pos > solidStart) strips.push([solidStart, pos]);
    solidStart = pos + cutW;
    pos += cutSpacing;
  }
  if (solidStart < hi) strips.push([solidStart, hi]);

  const result = [];
  for (const path of paths) {
    for (const [a, b] of strips) {
      const clipped = clipPolyAxis(path, axis, a, b);
      if (clipped.length >= 3) result.push(clipped);
    }
  }
  return result;
}


// ═══════════════════════════════════════════
//  Glyph Processing Pipeline
// ═══════════════════════════════════════════

function signedArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const j = (i + 1) % poly.length;
    a += poly[i][0] * poly[j][1] - poly[j][0] * poly[i][1];
  }
  return a / 2;
}

function processGlyph(rawPaths, params) {
  if (!rawPaths || !rawPaths.length) return { outer: [], inner: [] };

  let paths = rawPaths.map(p => p.map(pt => [pt[0], pt[1]]));

  // 1. Scale — 원점(0,0) 기준 스케일 → 커닝/어드밴스와 비례 유지
  if (params.scaleX !== 1 || params.scaleY !== 1) {
    paths = paths.map(p => p.map(pt => [
      pt[0] * params.scaleX,
      pt[1] * params.scaleY,
    ]));
  }

  // 2. Fill counter — 카운터(내부 공간) 제거, 가장 큰 외곽만 유지
  if (params.fillCounter && paths.length > 1) {
    const sorted = paths
      .map(p => ({ p, area: Math.abs(signedArea(p)) }))
      .sort((a, b) => b.area - a.area);
    paths = [sorted[0].p];
  }

  // 3. Thickness — Clipper offset으로 두께 조절
  if (params.thickness !== 0) {
    paths = clipperOffset(paths, params.thickness);
  }

  // 4. Corner rounding
  if (params.cornerR > 0) {
    paths = paths.map(p => roundCorners(p, params.cornerR));
  }

  // 5. Inline — 안쪽으로 inset하여 hollow 효과
  let insetPaths = [];
  if (params.inlineDepth > 0) {
    insetPaths = clipperOffset(paths, -params.inlineDepth);
  }

  // 6. Cuts
  if (params.cutDir !== 'none') {
    const allPts = paths.flat();
    if (allPts.length > 0) {
      const xs = allPts.map(p => p[0]), ys = allPts.map(p => p[1]);
      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);

      if (params.cutDir === 'vertical' || params.cutDir === 'grid') {
        paths = applyCuts(paths, 0, xMin, xMax, params.cutWidth, params.cutSpacing, params.cutOffset);
        if (insetPaths.length) insetPaths = applyCuts(insetPaths, 0, xMin, xMax, params.cutWidth, params.cutSpacing, params.cutOffset);
      }
      if (params.cutDir === 'horizontal' || params.cutDir === 'grid') {
        paths = applyCuts(paths, 1, yMin, yMax, params.cutWidth, params.cutSpacing, params.cutOffset);
        if (insetPaths.length) insetPaths = applyCuts(insetPaths, 1, yMin, yMax, params.cutWidth, params.cutSpacing, params.cutOffset);
      }
    }
  }

  return { outer: paths, inner: insetPaths };
}


// ═══════════════════════════════════════════
//  Canvas Rendering
// ═══════════════════════════════════════════

const canvas = $('cv');
const ctx = canvas.getContext('2d');

function resize() {
  const w = Math.min(window.innerWidth, 800);
  const h = Math.round(w * 0.55);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawContours(contours) {
  for (const c of contours) {
    if (c.length < 3) continue;
    ctx.moveTo(c[0][0], c[0][1]);
    for (let i = 1; i < c.length; i++) ctx.lineTo(c[i][0], c[i][1]);
    ctx.closePath();
  }
}

function render() {
  if (!glyphData) {
    resize();
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#555';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Loading...', w / 2, h / 2);
    requestAnimationFrame(render);
    return;
  }

  resize();
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);

  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, w, h);

  const params = getParams();
  const inst = glyphData.instances['extrabold'];
  if (!inst) { requestAnimationFrame(render); return; }

  const meta = glyphData.meta;
  const scale = params.fontSize / meta.unitsPerEm;
  const baseline = h * 0.72;

  let cursorX = 20;

  for (const ch of params.text) {
    const glyph = inst.glyphs[ch];

    if (!glyph) {
      // 없는 글리프 → 빈 칸
      cursorX += params.fontSize * 0.3;
      continue;
    }

    // 패스가 없는 글리프 (공백 등) → 어드밴스만 진행
    if (!glyph.p || glyph.p.length === 0) {
      cursorX += glyph.a * params.scaleX * scale;
      continue;
    }

    const { outer, inner } = processGlyph(glyph.p, params);

    ctx.save();
    ctx.translate(cursorX, baseline);
    ctx.scale(scale, -scale); // 폰트 Y축 반전

    ctx.beginPath();
    drawContours(outer);
    drawContours(inner);
    ctx.fillStyle = '#eee';
    ctx.fill('evenodd');

    ctx.restore();

    cursorX += glyph.a * params.scaleX * scale;
  }

  // Info bar
  $('info').textContent = `${inst.name} | w:${Math.round(params.scaleX*100)}% h:${Math.round(params.scaleY*100)}% thick:${params.thickness} inline:${params.inlineDepth} r:${params.cornerR}`;

  requestAnimationFrame(render);
}


// ═══════════════════════════════════════════
//  Export
// ═══════════════════════════════════════════

$('exportBtn').addEventListener('click', () => {
  if (!glyphData) return;
  const params = getParams();
  const inst = glyphData.instances['extrabold'];
  if (!inst) return;
  const meta = glyphData.meta;

  const notdef = new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 650, path: new opentype.Path() });
  const space  = new opentype.Glyph({ name: 'space', unicode: 32, advanceWidth: Math.round(meta.unitsPerEm * 0.25), path: new opentype.Path() });
  const glyphs = [notdef, space];

  for (const [ch, g] of Object.entries(inst.glyphs)) {
    if (g.u === 32 || g.u === 0) continue;
    if (!g.p || g.p.length === 0) continue;

    const { outer, inner } = processGlyph(g.p, params);
    const path = new opentype.Path();

    for (const contour of outer) {
      if (contour.length < 3) continue;
      path.moveTo(contour[0][0], contour[0][1]);
      for (let i = 1; i < contour.length; i++) path.lineTo(contour[i][0], contour[i][1]);
      path.close();
    }

    // Inner (reversed winding for CFF non-zero rule)
    for (const contour of inner) {
      if (contour.length < 3) continue;
      const rev = [...contour].reverse();
      path.moveTo(rev[0][0], rev[0][1]);
      for (let i = 1; i < rev.length; i++) path.lineTo(rev[i][0], rev[i][1]);
      path.close();
    }

    const aw = Math.round(g.a * params.scaleX);
    glyphs.push(new opentype.Glyph({ name: g.n, unicode: g.u, advanceWidth: aw, path }));
  }

  let styleName = inst.name.replace('CK Sans ', '');
  if (params.cutDir !== 'none') styleName += ' Inline';

  const font = new opentype.Font({
    familyName: 'CK Sans',
    styleName,
    unitsPerEm: meta.unitsPerEm,
    ascender: meta.ascender,
    descender: meta.descender,
    glyphs,
  });
  font.download('CKSans-' + styleName.replace(/\s+/g, '') + '.otf');
});


// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════

fetch('./glyphs.json')
  .then(r => r.json())
  .then(d => { glyphData = d; })
  .catch(e => console.error('Failed to load glyphs.json:', e));

requestAnimationFrame(render);
</script>
</body>
</html>
