<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CK Sans Editor</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2.2/clipper.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#111; color:#eee; font-family:system-ui,-apple-system,sans-serif; overflow-x:hidden; }
#cv { display:block; width:100%; border-bottom:1px solid #333; touch-action:none; }
.panel { padding:16px; max-width:800px; }
.row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.row label { font-size:11px; color:#888; min-width:64px; text-transform:uppercase; letter-spacing:.04em; }
.row input[type=range] { flex:1; accent-color:#0f0; height:20px; }
.row .v { font-size:11px; color:#0f0; min-width:32px; text-align:right; font-variant-numeric:tabular-nums; }
select { background:#222; color:#eee; border:1px solid #444; padding:6px 8px; border-radius:4px; font-size:13px; flex:1; }
input[type=text] { background:#222; color:#eee; border:1px solid #444; padding:8px; border-radius:4px; font-size:15px; width:100%; }
.sep { height:1px; background:#333; margin:12px 0; }
.sl { font-size:10px; color:#555; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
button { background:#0f0; color:#111; border:none; padding:12px; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; width:100%; margin-top:8px; }
button:active { opacity:.7; }
#info { font:9px/1.4 monospace; color:#444; padding:4px 8px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="info"></div>
<div class="panel">

  <input type="text" id="text" value="CONDENSED KIWI" placeholder="Type here...">
  <div class="sep"></div>

  <div class="row">
    <label>Size</label>
    <input type="range" id="size" min="24" max="240" value="80">
    <span class="v" id="sizeV">80</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Transform</div>

  <div class="row">
    <label>Width %</label>
    <input type="range" id="sx" min="50" max="150" value="100">
    <span class="v" id="sxV">100</span>
  </div>
  <div class="row">
    <label>Height %</label>
    <input type="range" id="sy" min="50" max="150" value="100">
    <span class="v" id="syV">100</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Stroke</div>

  <div class="row">
    <label>Thickness</label>
    <input type="range" id="thick" min="-60" max="60" value="0">
    <span class="v" id="thickV">0</span>
  </div>
  <div class="row">
    <label>Inline</label>
    <input type="range" id="inline" min="0" max="100" value="0">
    <span class="v" id="inlineV">0</span>
  </div>
  <div class="row">
    <label>Corner R</label>
    <input type="range" id="corner" min="0" max="80" value="0">
    <span class="v" id="cornerV">0</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Cut</div>

  <div class="row">
    <label>Direction</label>
    <select id="cutDir">
      <option value="none">None</option>
      <option value="v">Vertical</option>
      <option value="h">Horizontal</option>
      <option value="grid">Grid</option>
    </select>
  </div>
  <div class="row">
    <label>Cut W</label>
    <input type="range" id="cutW" min="1" max="80" value="12">
    <span class="v" id="cutWV">12</span>
  </div>
  <div class="row">
    <label>Spacing</label>
    <input type="range" id="cutS" min="20" max="200" value="70">
    <span class="v" id="cutSV">70</span>
  </div>

  <div class="sep"></div>
  <button id="exportBtn">Export .otf</button>
</div>

<script>
// ════════════════════════════════════════════════
//  CK Sans Editor v2 — opentype.js 직접 로드
// ════════════════════════════════════════════════

let font = null;   // opentype.js Font object
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const $ = id => document.getElementById(id);
const N = id => +$(id).value;

// ── Slider sync ──
document.querySelectorAll('input[type=range]').forEach(el => {
  const v = $(el.id + 'V');
  if (v) el.oninput = () => { v.textContent = el.value; draw(); };
});
$('text').oninput = draw;
$('cutDir').onchange = draw;


// ════════════════════════════════════════════════
//  Clipper offset — 와인딩 반전 처리
// ════════════════════════════════════════════════
//  opentype.js 컨투어: 외곽=CCW, 카운터=CW (PostScript/CFF 규칙)
//  Clipper: 외곽=CCW, hole=CW — 동일!
//  → opentype.js 사용 시 와인딩 반전 불필요

const CLIP_SCALE = 100; // 소수점 정밀도 보존

function clipperOffset(contours, dist) {
  if (dist === 0 || !contours.length) return contours.map(c => c.map(p => ({x:p.x, y:p.y})));
  const copy = contours.map(c => c.map(p => ({x:p.x, y:p.y})));

  try {
    const co = new ClipperLib.ClipperOffset();
    co.MiterLimit = 2;
    co.ArcTolerance = 0.25 * CLIP_SCALE;

    for (const c of contours) {
      if (c.length < 3) continue;
      const cp = c.map(p => ({X: Math.round(p.x * CLIP_SCALE), Y: Math.round(p.y * CLIP_SCALE)}));
      co.AddPath(cp, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
    }

    const sol = new ClipperLib.Paths();
    co.Execute(sol, dist * CLIP_SCALE);

    if (!sol.length) return copy;
    return sol.map(s => s.map(p => ({x: p.X / CLIP_SCALE, y: p.Y / CLIP_SCALE}))).filter(c => c.length >= 3);
  } catch (e) {
    console.warn('Clipper failed:', e);
    return copy;
  }
}


// ════════════════════════════════════════════════
//  opentype.js Path → contours (point arrays)
// ════════════════════════════════════════════════

function pathToContours(path) {
  // opentype.js path.commands → [{x,y}] 배열들
  const contours = [];
  let cur = [];
  const STEP = 8; // 커브 해상도

  for (const cmd of path.commands) {
    switch (cmd.type) {
      case 'M':
        if (cur.length >= 3) contours.push(cur);
        cur = [{x: cmd.x, y: cmd.y}];
        break;
      case 'L':
        cur.push({x: cmd.x, y: cmd.y});
        break;
      case 'Q': {
        const p0 = cur[cur.length - 1];
        for (let i = 1; i <= STEP; i++) {
          const t = i / STEP, mt = 1 - t;
          cur.push({
            x: mt*mt*p0.x + 2*mt*t*cmd.x1 + t*t*cmd.x,
            y: mt*mt*p0.y + 2*mt*t*cmd.y1 + t*t*cmd.y
          });
        }
        break;
      }
      case 'C': {
        const p0 = cur[cur.length - 1];
        for (let i = 1; i <= STEP; i++) {
          const t = i / STEP, mt = 1 - t;
          cur.push({
            x: mt*mt*mt*p0.x + 3*mt*mt*t*cmd.x1 + 3*mt*t*t*cmd.x2 + t*t*t*cmd.x,
            y: mt*mt*mt*p0.y + 3*mt*mt*t*cmd.y1 + 3*mt*t*t*cmd.y2 + t*t*t*cmd.y
          });
        }
        break;
      }
      case 'Z':
        if (cur.length >= 3) contours.push(cur);
        cur = [];
        break;
    }
  }
  if (cur.length >= 3) contours.push(cur);
  return contours;
}


// ════════════════════════════════════════════════
//  Corner rounding
// ════════════════════════════════════════════════

function roundCorners(pts, r) {
  if (r <= 0 || pts.length < 3) return pts;
  const n = pts.length, out = [];
  for (let i = 0; i < n; i++) {
    const prev = pts[(i-1+n)%n], curr = pts[i], next = pts[(i+1)%n];
    const dx1 = prev.x-curr.x, dy1 = prev.y-curr.y;
    const dx2 = next.x-curr.x, dy2 = next.y-curr.y;
    const l1 = Math.hypot(dx1,dy1), l2 = Math.hypot(dx2,dy2);
    if (l1 < 1 || l2 < 1) { out.push({x:curr.x,y:curr.y}); continue; }
    const mr = Math.min(r, l1*.4, l2*.4);
    const p0 = {x: curr.x+dx1/l1*mr, y: curr.y+dy1/l1*mr};
    const p2 = {x: curr.x+dx2/l2*mr, y: curr.y+dy2/l2*mr};
    for (let s = 0; s <= 5; s++) {
      const t = s/5, mt = 1-t;
      out.push({x: mt*mt*p0.x+2*mt*t*curr.x+t*t*p2.x, y: mt*mt*p0.y+2*mt*t*curr.y+t*t*p2.y});
    }
  }
  return out;
}


// ════════════════════════════════════════════════
//  Cut effect — polygon clipping
// ════════════════════════════════════════════════

function clipHalf(pts, axis, val, keep) {
  if (pts.length < 3) return [];
  const out = [];
  const key = axis === 'x' ? 'x' : 'y';
  for (let i = 0; i < pts.length; i++) {
    const c = pts[i], n = pts[(i+1)%pts.length];
    const ci = keep === 'gte' ? c[key] >= val : c[key] <= val;
    const ni = keep === 'gte' ? n[key] >= val : n[key] <= val;
    if (ci) out.push(c);
    if (ci !== ni) {
      const t = (val - c[key]) / (n[key] - c[key]);
      out.push({x: c.x + t*(n.x-c.x), y: c.y + t*(n.y-c.y)});
    }
  }
  return out;
}

function cutStrips(contours, axis, lo, hi, cutW, cutS) {
  const strips = [];
  let pos = lo, solid = lo;
  while (pos < hi) {
    if (pos > solid) strips.push([solid, pos]);
    solid = pos + cutW;
    pos += cutS;
  }
  if (solid < hi) strips.push([solid, hi]);

  const result = [];
  for (const c of contours) {
    for (const [a, b] of strips) {
      let cl = clipHalf(c, axis, a, 'gte');
      cl = clipHalf(cl, axis, b, 'lte');
      if (cl.length >= 3) result.push(cl);
    }
  }
  return result;
}


// ════════════════════════════════════════════════
//  Process glyph
// ════════════════════════════════════════════════

function processGlyph(glyph, params) {
  const path = glyph.getPath(0, 0, params.upm); // 원본 좌표
  let contours = pathToContours(path);
  if (!contours.length) return {outer:[], inner:[]};

  // Scale (원점 기준)
  if (params.sx !== 1 || params.sy !== 1) {
    contours = contours.map(c => c.map(p => ({x: p.x * params.sx, y: p.y * params.sy})));
  }

  // Thickness
  if (params.thick !== 0) contours = clipperOffset(contours, params.thick);

  // Corner R
  if (params.corner > 0) contours = contours.map(c => roundCorners(c, params.corner));

  // Inline
  let inner = [];
  if (params.inline > 0) inner = clipperOffset(contours, -params.inline);

  // Cuts
  if (params.cutDir !== 'none' && contours.length) {
    const all = contours.flat();
    const xs = all.map(p => p.x), ys = all.map(p => p.y);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);

    if (params.cutDir === 'v' || params.cutDir === 'grid')
      contours = cutStrips(contours, 'x', xMin, xMax, params.cutW, params.cutS);
    if (params.cutDir === 'h' || params.cutDir === 'grid')
      contours = cutStrips(contours, 'y', yMin, yMax, params.cutW, params.cutS);

    if (inner.length) {
      if (params.cutDir === 'v' || params.cutDir === 'grid')
        inner = cutStrips(inner, 'x', xMin, xMax, params.cutW, params.cutS);
      if (params.cutDir === 'h' || params.cutDir === 'grid')
        inner = cutStrips(inner, 'y', yMin, yMax, params.cutW, params.cutS);
    }
  }

  return {outer: contours, inner};
}


// ════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════

function resize() {
  const w = Math.min(window.innerWidth, 800);
  const h = Math.round(w * 0.5);
  const dpr = window.devicePixelRatio || 2;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {w, h};
}

function drawContours(contours) {
  for (const c of contours) {
    if (c.length < 3) continue;
    ctx.moveTo(c[0].x, c[0].y);
    for (let i = 1; i < c.length; i++) ctx.lineTo(c[i].x, c[i].y);
    ctx.closePath();
  }
}

function draw() {
  const {w, h} = resize();
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, w, h);

  if (!font) {
    ctx.fillStyle = '#555';
    ctx.font = '13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Loading CKSans-Base...', w/2, h/2);
    return;
  }

  const text = $('text').value || 'A';
  const size = N('size');
  const upm = font.unitsPerEm;
  const scale = size / upm;
  const baseline = h * 0.72;

  const params = {
    upm,
    sx: N('sx') / 100,
    sy: N('sy') / 100,
    thick: N('thick'),
    inline: N('inline'),
    corner: N('corner'),
    cutDir: $('cutDir').value,
    cutW: N('cutW'),
    cutS: N('cutS'),
  };

  let cursorX = 16;

  for (const ch of text) {
    const glyph = font.charToGlyph(ch);
    if (!glyph || glyph.index === 0) {
      cursorX += size * 0.3;
      continue;
    }

    const aw = (glyph.advanceWidth || upm * 0.5) * params.sx * scale;

    const {outer, inner} = processGlyph(glyph, params);
    if (!outer.length) { cursorX += aw; continue; }

    ctx.save();
    ctx.translate(cursorX, baseline);
    ctx.scale(scale, scale); // opentype.js는 이미 Y가 아래로 양수

    ctx.beginPath();
    drawContours(outer);
    drawContours(inner);
    ctx.fillStyle = '#eee';
    ctx.fill('evenodd');

    ctx.restore();
    cursorX += aw;
  }

  // Info
  $('info').textContent = `CK Sans Base | ${font.numGlyphs} glyphs | size:${size} w:${params.sx*100|0}% h:${params.sy*100|0}% thick:${params.thick} inline:${params.inline} r:${params.corner}`;
}


// ════════════════════════════════════════════════
//  Export
// ════════════════════════════════════════════════

$('exportBtn').onclick = () => {
  if (!font) return;

  const params = {
    upm: font.unitsPerEm,
    sx: N('sx') / 100,
    sy: N('sy') / 100,
    thick: N('thick'),
    inline: N('inline'),
    corner: N('corner'),
    cutDir: $('cutDir').value,
    cutW: N('cutW'),
    cutS: N('cutS'),
  };

  const notdef = new opentype.Glyph({name:'.notdef', unicode:0, advanceWidth:650, path:new opentype.Path()});
  const space = new opentype.Glyph({name:'space', unicode:32, advanceWidth:Math.round(font.unitsPerEm*0.25), path:new opentype.Path()});
  const glyphs = [notdef, space];

  for (let i = 0; i < font.glyphs.length; i++) {
    const g = font.glyphs.get(i);
    if (!g.unicode || g.unicode <= 32) continue;

    const {outer, inner} = processGlyph(g, params);
    const path = new opentype.Path();

    for (const c of outer) {
      if (c.length < 3) continue;
      path.moveTo(c[0].x, c[0].y);
      for (let j = 1; j < c.length; j++) path.lineTo(c[j].x, c[j].y);
      path.close();
    }
    for (const c of inner) {
      if (c.length < 3) continue;
      const rev = [...c].reverse();
      path.moveTo(rev[0].x, rev[0].y);
      for (let j = 1; j < rev.length; j++) path.lineTo(rev[j].x, rev[j].y);
      path.close();
    }

    const aw = Math.round((g.advanceWidth || 500) * params.sx);
    glyphs.push(new opentype.Glyph({name: g.name, unicode: g.unicode, advanceWidth: aw, path}));
  }

  let style = 'ExtraBold';
  if (params.cutDir !== 'none') style += ' Cut';
  if (params.inline > 0) style += ' Inline';

  const expFont = new opentype.Font({
    familyName: 'CK Sans', styleName: style,
    unitsPerEm: font.unitsPerEm, ascender: font.ascender, descender: font.descender,
    glyphs
  });
  expFont.download('CKSans-' + style.replace(/\s+/g,'') + '.otf');
};


// ════════════════════════════════════════════════
//  Load font — opentype.js로 TTF 직접 파싱
// ════════════════════════════════════════════════

opentype.load('./CKSans-Base.ttf', (err, f) => {
  if (err) { console.error('Font load failed:', err); return; }
  font = f;
  console.log(`Loaded: ${f.names.fontFamily?.en} — ${f.numGlyphs} glyphs`);
  draw();
});

window.onresize = draw;
</script>
</body>
</html>
