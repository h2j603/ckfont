<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CK Sans Editor</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2.2/clipper.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#eee; font-family:system-ui,sans-serif; overflow-x:hidden; }
#canvas-wrap { width:100%; border-bottom:1px solid #333; }
canvas { display:block; width:100%!important; height:auto!important; }
.controls { padding:16px; display:flex; flex-direction:column; gap:10px; }
.row { display:flex; align-items:center; gap:8px; }
.row label { font-size:11px; color:#888; min-width:70px; text-transform:uppercase; letter-spacing:.05em; }
.row input[type=range] { flex:1; accent-color:#0f0; }
.row .val { font-size:11px; color:#0f0; min-width:36px; text-align:right; font-variant-numeric:tabular-nums; }
select { background:#222; color:#eee; border:1px solid #444; padding:6px 8px; border-radius:4px; font-size:13px; flex:1; }
input[type=text] { background:#222; color:#eee; border:1px solid #444; padding:6px 8px; border-radius:4px; font-size:14px; flex:1; }
.sep { height:1px; background:#333; }
button { background:#0f0; color:#111; border:none; padding:12px; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; }
button:active { opacity:.8; }
.sl { font-size:10px; color:#666; text-transform:uppercase; letter-spacing:.1em; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div class="controls">
  <div class="row">
    <input type="text" id="previewText" value="CONDENSED KIWI">
  </div>
  <div class="row">
    <label>Size</label>
    <input type="range" id="fontSize" min="20" max="200" value="80">
    <span class="val" id="fontSizeVal">80</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Transform</div>

  <div class="row">
    <label>Width %</label>
    <input type="range" id="scaleX" min="50" max="150" value="100" step="1">
    <span class="val" id="scaleXVal">100</span>
  </div>
  <div class="row">
    <label>Height %</label>
    <input type="range" id="scaleY" min="50" max="150" value="100" step="1">
    <span class="val" id="scaleYVal">100</span>
  </div>
  <div class="row">
    <label>Fill counter</label>
    <select id="fillCounter">
      <option value="off">Off</option>
      <option value="on">On (fill O, D, etc.)</option>
    </select>
  </div>

  <div class="sep"></div>
  <div class="sl">Stroke</div>

  <div class="row">
    <label>Thickness</label>
    <input type="range" id="weight" min="-50" max="50" value="0" step="1">
    <span class="val" id="weightVal">0</span>
  </div>
  <div class="row">
    <label>Inline</label>
    <input type="range" id="inlineDepth" min="0" max="80" value="0" step="1">
    <span class="val" id="inlineDepthVal">0</span>
  </div>
  <div class="row">
    <label>Corner R</label>
    <input type="range" id="cornerR" min="0" max="60" value="0" step="1">
    <span class="val" id="cornerRVal">0</span>
  </div>

  <div class="sep"></div>
  <div class="sl">Cut Effect</div>

  <div class="row">
    <label>Direction</label>
    <select id="cutDir">
      <option value="none">None</option>
      <option value="vertical">Vertical</option>
      <option value="horizontal">Horizontal</option>
      <option value="grid">Grid</option>
    </select>
  </div>
  <div class="row">
    <label>Width</label>
    <input type="range" id="cutWidth" min="1" max="80" value="12">
    <span class="val" id="cutWidthVal">12</span>
  </div>
  <div class="row">
    <label>Spacing</label>
    <input type="range" id="cutSpacing" min="10" max="200" value="70">
    <span class="val" id="cutSpacingVal">70</span>
  </div>
  <div class="row">
    <label>Offset</label>
    <input type="range" id="cutOffset" min="0" max="100" value="0">
    <span class="val" id="cutOffsetVal">0</span>
  </div>

  <div class="sep"></div>
  <button id="exportBtn">Export .otf</button>
</div>

<script>
let glyphData = null;

function getParams() {
  return {
    text: document.getElementById('previewText').value || 'H',
    instanceKey: 'extrabold',
    fontSize: +document.getElementById('fontSize').value,
    scaleX: +document.getElementById('scaleX').value / 100,
    scaleY: +document.getElementById('scaleY').value / 100,
    fillCounter: document.getElementById('fillCounter').value === 'on',
    weight: +document.getElementById('weight').value,
    inlineDepth: +document.getElementById('inlineDepth').value,
    cornerR: +document.getElementById('cornerR').value,
    cutDir: document.getElementById('cutDir').value,
    cutWidth: +document.getElementById('cutWidth').value,
    cutSpacing: +document.getElementById('cutSpacing').value,
    cutOffset: +document.getElementById('cutOffset').value,
  };
}

// ═══ Geometry Utils ═══

function polyArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const j = (i+1) % poly.length;
    a += poly[i][0]*poly[j][1] - poly[j][0]*poly[i][1];
  }
  return a / 2;
}

function lineIntersect(a1, a2, b1, b2) {
  const d = (a1[0]-a2[0])*(b1[1]-b2[1]) - (a1[1]-a2[1])*(b1[0]-b2[0]);
  if (Math.abs(d) < 1e-6) return null;
  const t = ((a1[0]-b1[0])*(b1[1]-b2[1]) - (a1[1]-b1[1])*(b1[0]-b2[0])) / d;
  return [a1[0]+t*(a2[0]-a1[0]), a1[1]+t*(a2[1]-a1[1])];
}

// ═══ Polygon Offset (Clipper library) ═══

function offsetPolygon(poly, dist) {
  if (poly.length < 3 || dist === 0) return poly.map(p => [p[0], p[1]]);

  try {
    // 와인딩 반전 (폰트→Clipper 규칙)
    const clipperPath = poly.map(p => ({ X: Math.round(p[0]), Y: Math.round(p[1]) }));
    clipperPath.reverse();

    const co = new ClipperLib.ClipperOffset();
    co.MiterLimit = 2;
    co.ArcTolerance = 5;
    co.AddPath(clipperPath, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);

    const solution = new ClipperLib.Paths();
    co.Execute(solution, dist);

    if (solution.length === 0) return [];

    let best = solution[0];
    let bestArea = 0;
    for (const s of solution) {
      const a = Math.abs(ClipperLib.Clipper.Area(s));
      if (a > bestArea) { bestArea = a; best = s; }
    }

    const result = best.map(p => [p.X, p.Y]);
    result.reverse(); // 다시 폰트 와인딩으로
    return result;
  } catch (e) {
    return poly.map(p => [p[0], p[1]]);
  }
}

function offsetPaths(paths, dist) {
  if (dist === 0) return paths.map(p => p.map(pt => [pt[0], pt[1]]));
  const copy = paths.map(p => p.map(pt => [pt[0], pt[1]]));

  try {
    // 폰트 컨투어는 외곽=CW(음수 면적), 카운터=CCW(양수 면적)
    // Clipper는 외곽=CCW, hole=CW를 기대 → 와인딩 반전 필요
    const clipperPaths = paths.map(p => {
      const cp = p.map(pt => ({ X: Math.round(pt[0]), Y: Math.round(pt[1]) }));
      cp.reverse();
      return cp;
    });

    const co = new ClipperLib.ClipperOffset();
    co.MiterLimit = 2;
    co.ArcTolerance = 5;
    for (const cp of clipperPaths) {
      co.AddPath(cp, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
    }

    const solution = new ClipperLib.Paths();
    co.Execute(solution, dist);

    // 결과를 다시 폰트 와인딩으로 반전
    const result = solution.map(s => {
      const pts = s.map(p => [p.X, p.Y]);
      pts.reverse();
      return pts;
    }).filter(p => p.length >= 3);
    return result.length > 0 ? result : copy;
  } catch (e) {
    return copy; // 실패 시 원본 반환
  }
}

// ═══ Corner Rounding ═══

function roundCorners(poly, radius) {
  if (radius <= 0 || poly.length < 3) return poly;
  const n = poly.length;
  const result = [];
  const steps = 5;

  for (let i = 0; i < n; i++) {
    const prev = poly[(i-1+n) % n];
    const curr = poly[i];
    const next = poly[(i+1) % n];

    let dx1 = prev[0]-curr[0], dy1 = prev[1]-curr[1];
    let dx2 = next[0]-curr[0], dy2 = next[1]-curr[1];
    const len1 = Math.sqrt(dx1*dx1 + dy1*dy1);
    const len2 = Math.sqrt(dx2*dx2 + dy2*dy2);

    if (len1 < 1 || len2 < 1) { result.push([curr[0], curr[1]]); continue; }

    const r = Math.min(radius, len1 * 0.4, len2 * 0.4);
    dx1 /= len1; dy1 /= len1;
    dx2 /= len2; dy2 /= len2;

    const p0 = [curr[0]+dx1*r, curr[1]+dy1*r];
    const p2 = [curr[0]+dx2*r, curr[1]+dy2*r];

    // Quadratic bezier with corner as control point
    for (let s = 0; s <= steps; s++) {
      const t = s / steps, mt = 1-t;
      result.push([
        mt*mt*p0[0] + 2*mt*t*curr[0] + t*t*p2[0],
        mt*mt*p0[1] + 2*mt*t*curr[1] + t*t*p2[1]
      ]);
    }
  }
  return result;
}

// ═══ Clipping (Sutherland-Hodgman) ═══

function clipEdge(poly, inside) {
  if (poly.length < 3) return [];
  const r = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i+1)%poly.length];
    const ci = inside(c), ni = inside(n);
    if (ci) r.push(c);
    if (ci !== ni) {
      const dx = n[0]-c[0], dy = n[1]-c[1];
      // Find t where boundary is crossed
      // For axis-aligned clips, we override this in the callers
      r.push(edgeIntersect(c, n, inside));
    }
  }
  return r;
}

function clipRight(poly, xMin) {
  if (poly.length < 3) return [];
  const r = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i+1)%poly.length];
    const ci = c[0] >= xMin, ni = n[0] >= xMin;
    if (ci) r.push(c);
    if (ci !== ni) {
      const t = (xMin-c[0])/(n[0]-c[0]);
      r.push([xMin, c[1]+t*(n[1]-c[1])]);
    }
  }
  return r;
}
function clipLeft(poly, xMax) {
  if (poly.length < 3) return [];
  const r = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i+1)%poly.length];
    const ci = c[0] <= xMax, ni = n[0] <= xMax;
    if (ci) r.push(c);
    if (ci !== ni) {
      const t = (xMax-c[0])/(n[0]-c[0]);
      r.push([xMax, c[1]+t*(n[1]-c[1])]);
    }
  }
  return r;
}
function clipTop(poly, yMax) {
  if (poly.length < 3) return [];
  const r = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i+1)%poly.length];
    const ci = c[1] <= yMax, ni = n[1] <= yMax;
    if (ci) r.push(c);
    if (ci !== ni) {
      const t = (yMax-c[1])/(n[1]-c[1]);
      r.push([c[0]+t*(n[0]-c[0]), yMax]);
    }
  }
  return r;
}
function clipBottom(poly, yMin) {
  if (poly.length < 3) return [];
  const r = [];
  for (let i = 0; i < poly.length; i++) {
    const c = poly[i], n = poly[(i+1)%poly.length];
    const ci = c[1] >= yMin, ni = n[1] >= yMin;
    if (ci) r.push(c);
    if (ci !== ni) {
      const t = (yMin-c[1])/(n[1]-c[1]);
      r.push([c[0]+t*(n[0]-c[0]), yMin]);
    }
  }
  return r;
}

// ═══ Cut Effect ═══

function cutAxis(paths, axis, lo, hi, cutW, cutS, cutOff) {
  const strips = [];
  let pos = lo + cutOff, solidStart = lo;
  while (pos < hi) {
    if (pos > solidStart) strips.push([solidStart, pos]);
    solidStart = pos + cutW;
    pos += cutS;
  }
  if (solidStart < hi) strips.push([solidStart, hi]);

  const result = [];
  for (const path of paths) {
    for (const [a, b] of strips) {
      const clipped = axis === 'x'
        ? clipLeft(clipRight(path, a), b)
        : clipTop(clipBottom(path, a), b);
      if (clipped.length >= 3) result.push(clipped);
    }
  }
  return result;
}

// ═══ Full Processing Pipeline ═══

function processGlyph(paths, params) {
  if (!paths || !paths.length) return { outer: [], inner: [] };

  let processed = paths.map(p => p.map(pt => [pt[0], pt[1]]));

  // 0. Scale (장평/높이) — 원점 기준으로 스케일해야 커닝 유지
  if (params.scaleX !== 1 || params.scaleY !== 1) {
    processed = processed.map(p => p.map(pt => [
      pt[0] * params.scaleX,
      pt[1] * params.scaleY
    ]));
  }

  // 0b. Fill counter (remove counter contours = small/inner contours)
  if (params.fillCounter && processed.length > 1) {
    // Keep only the largest contour (by absolute area)
    const withArea = processed.map(p => ({ p, area: Math.abs(polyArea(p)) }));
    withArea.sort((a,b) => b.area - a.area);
    processed = [withArea[0].p];
  }

  // 1. Weight offset (all contours together for correct topology)
  if (params.weight !== 0) {
    processed = offsetPaths(processed, params.weight);
  }

  // 2. Corner rounding
  if (params.cornerR > 0) {
    processed = processed.map(p => roundCorners(p, params.cornerR));
  }

  // 3. Inline (compute inset for hollow effect)
  let insetPaths = [];
  if (params.inlineDepth > 0) {
    insetPaths = offsetPaths(processed, -params.inlineDepth);
  }

  // 4. Cuts
  if (params.cutDir !== 'none') {
    const allPts = processed.flat();
    if (allPts.length > 0) {
      const xs = allPts.map(p => p[0]), ys = allPts.map(p => p[1]);
      const xMin = Math.min(...xs), xMax = Math.max(...xs);
      const yMin = Math.min(...ys), yMax = Math.max(...ys);

      if (params.cutDir === 'vertical' || params.cutDir === 'grid') {
        processed = cutAxis(processed, 'x', xMin, xMax, params.cutWidth, params.cutSpacing, params.cutOffset);
        if (insetPaths.length) insetPaths = cutAxis(insetPaths, 'x', xMin, xMax, params.cutWidth, params.cutSpacing, params.cutOffset);
      }
      if (params.cutDir === 'horizontal' || params.cutDir === 'grid') {
        processed = cutAxis(processed, 'y', yMin, yMax, params.cutWidth, params.cutSpacing, params.cutOffset);
        if (insetPaths.length) insetPaths = cutAxis(insetPaths, 'y', yMin, yMax, params.cutWidth, params.cutSpacing, params.cutOffset);
      }
    }
  }

  return { outer: processed, inner: insetPaths };
}

// ═══ p5.js Sketch ═══

const sketch = (p) => {
  const W = () => Math.min(window.innerWidth, 800);
  const H = () => Math.round(W() * 0.55);

  p.setup = () => {
    p.createCanvas(W(), H()).parent('canvas-wrap');
    p.pixelDensity(2);
  };
  p.windowResized = () => p.resizeCanvas(W(), H());

  p.draw = () => {
    if (!glyphData) {
      p.background(17); p.fill(100); p.textAlign(p.CENTER,p.CENTER);
      p.textSize(12); p.text('Loading...', p.width/2, p.height/2);
      return;
    }

    const params = getParams();
    const inst = glyphData.instances[params.instanceKey];
    if (!inst) return;

    const meta = glyphData.meta;
    const scale = params.fontSize / meta.unitsPerEm;
    const baseline = p.height * 0.72;

    p.background(17);

    const ctx = p.drawingContext;
    let cursorX = 20;

    for (const ch of params.text) {
      const glyph = inst.glyphs[ch];
      if (!glyph) { cursorX += params.fontSize * 0.3; continue; }

      const { outer, inner } = processGlyph(glyph.p, params);

      ctx.save();
      ctx.translate(cursorX, baseline);
      ctx.scale(scale, -scale);

      // Draw all contours in one path, use evenodd for inline holes
      ctx.beginPath();
      for (const path of outer) {
        if (path.length < 3) continue;
        ctx.moveTo(path[0][0], path[0][1]);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
        ctx.closePath();
      }
      for (const path of inner) {
        if (path.length < 3) continue;
        ctx.moveTo(path[0][0], path[0][1]);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
        ctx.closePath();
      }
      ctx.fillStyle = '#eee';
      ctx.fill('evenodd');

      ctx.restore();
      cursorX += glyph.a * params.scaleX * scale;
    }

    // Info bar
    p.fill(60); p.noStroke(); p.textSize(9); p.textAlign(p.LEFT,p.TOP);
    p.textFont('monospace');
    const info = `${inst.name} | w:${Math.round(params.scaleX*100)}% h:${Math.round(params.scaleY*100)}% wt:${params.weight} in:${params.inlineDepth} r:${params.cornerR}`;
    p.text(info, 6, 4);
  };
};
new p5(sketch);

// ═══ Controls ═══
document.querySelectorAll('input[type=range]').forEach(el => {
  const v = document.getElementById(el.id + 'Val');
  el.addEventListener('input', () => { if (v) v.textContent = el.value; });
});

// ═══ Export ═══
document.getElementById('exportBtn').addEventListener('click', () => {
  if (!glyphData) return;
  const params = getParams();
  const inst = glyphData.instances[params.instanceKey];
  if (!inst) return;
  const meta = glyphData.meta;

  const notdef = new opentype.Glyph({ name:'.notdef', unicode:0, advanceWidth:650, path:new opentype.Path() });
  const space = new opentype.Glyph({ name:'space', unicode:32, advanceWidth:Math.round(meta.unitsPerEm*0.25), path:new opentype.Path() });
  const glyphs = [notdef, space];

  for (const [ch, g] of Object.entries(inst.glyphs)) {
    if (g.u === 32) continue;
    const { outer, inner } = processGlyph(g.p, params);

    const path = new opentype.Path();

    // Outer contours
    for (const contour of outer) {
      if (contour.length < 3) continue;
      path.moveTo(contour[0][0], contour[0][1]);
      for (let i = 1; i < contour.length; i++) path.lineTo(contour[i][0], contour[i][1]);
      path.close();
    }

    // Inner contours (reversed winding for CFF non-zero rule)
    for (const contour of inner) {
      if (contour.length < 3) continue;
      const rev = [...contour].reverse();
      path.moveTo(rev[0][0], rev[0][1]);
      for (let i = 1; i < rev.length; i++) path.lineTo(rev[i][0], rev[i][1]);
      path.close();
    }

    const aw = Math.round(g.a * params.scaleX);
    glyphs.push(new opentype.Glyph({ name:g.n, unicode:g.u, advanceWidth:aw, path }));
  }

  let styleName = inst.name.replace('CK Sans ','');
  if (params.cutDir !== 'none') styleName += ' Inline';

  const font = new opentype.Font({
    familyName:'CK Sans', styleName,
    unitsPerEm:meta.unitsPerEm, ascender:meta.ascender, descender:meta.descender,
    glyphs
  });
  font.download('CKSans-' + styleName.replace(/\s+/g,'') + '.otf');
});

// ═══ Load ═══
fetch('./glyphs.json').then(r=>r.json()).then(d=>{glyphData=d;}).catch(e=>console.error(e));
</script>
</body>
</html>
