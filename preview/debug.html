<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font Debug v2</title>
<style>
/* Test 1: Cut KR woff2 (v5 re-compressed) */
@font-face { font-family: 'CutKR_woff2'; src: url('CKSans-Cut-KR-v5.woff2') format('woff2'); }
/* Test 2: Cut KR TTF (raw) */
@font-face { font-family: 'CutKR_ttf'; src: url('CKSans-Cut-KR-v5.ttf') format('truetype'); }
/* Test 3: Pre-cut Regular KR woff2 (no modular cut) */
@font-face { font-family: 'RegKR'; src: url('CKSans-KR-Regular.woff2') format('woff2'); }
/* Test 4: Latin Cut (working reference) */
@font-face { font-family: 'CKCut'; src: url('CKSans-Cut-v4.woff2') format('woff2'); }

body { background: #000; color: #fff; font-family: system-ui; padding: 10px; }
.test { margin: 24px 0; border-bottom: 1px solid #222; padding-bottom: 16px; }
.label { font-size: 11px; color: #666; margin-bottom: 4px; }
.char { font-size: 150px; line-height: 1; }
.info { font-size: 12px; color: #0f0; margin-top: 8px; }
.err { color: #f00; }
</style>
</head><body>

<h3 style="font-size:14px;color:#0f0">Font Debug v2 — Safari load test</h3>

<div class="test">
  <div class="label">1. Latin CKCut (reference — should show bars)</div>
  <div class="char" style="font-family:'CKCut',sans-serif">AB</div>
  <div class="info" id="s1">...</div>
</div>

<div class="test">
  <div class="label">2. KR Pre-cut Regular woff2 (NO modular cut — does it load?)</div>
  <div class="char" style="font-family:'RegKR',sans-serif">가나</div>
  <div class="info" id="s2">...</div>
</div>

<div class="test">
  <div class="label">3. KR Cut woff2 v5 (re-compressed)</div>
  <div class="char" style="font-family:'CutKR_woff2',sans-serif">가나</div>
  <div class="info" id="s3">...</div>
</div>

<div class="test">
  <div class="label">4. KR Cut TTF (raw, 7.6MB)</div>
  <div class="char" style="font-family:'CutKR_ttf',sans-serif">가나</div>
  <div class="info" id="s4">...</div>
</div>

<div class="test">
  <div class="label">5. System sans-serif (fallback reference)</div>
  <div class="char" style="font-family:sans-serif">가나</div>
  <div class="info" id="s5">system font</div>
</div>

<script>
const tests = [
  { id: 's1', family: 'CKCut', label: 'CKCut' },
  { id: 's2', family: 'RegKR', label: 'RegKR' },
  { id: 's3', family: 'CutKR_woff2', label: 'CutKR woff2' },
  { id: 's4', family: 'CutKR_ttf', label: 'CutKR TTF' },
];

document.fonts.ready.then(() => {
  tests.forEach(t => {
    const el = document.getElementById(t.id);
    let status = 'unknown';
    document.fonts.forEach(f => {
      if (f.family === t.family) status = f.status;
    });
    const check = document.fonts.check('150px "' + t.family + '"');
    el.textContent = t.label + ': status=' + status + ', check=' + check;
    el.className = (status === 'loaded') ? 'info' : 'info err';
  });
});
</script>
</body></html>
