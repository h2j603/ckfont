<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font Debug</title>
<style>
@font-face { font-family: 'CKCut'; src: url('CKSans-Cut-v4.woff2') format('woff2'); }
@font-face { font-family: 'CKCutKR'; src: url('CKSans-Cut-KR-v4.woff2') format('woff2'); }

body { background: #000; color: #fff; font-family: system-ui; padding: 10px; }
.test { margin: 20px 0; }
.label { font-size: 11px; color: #666; margin-bottom: 4px; }
.char { font-size: 200px; line-height: 1; }
.info { font-size: 11px; color: #0f0; margin-top: 4px; }
canvas { border: 1px solid #333; display: block; margin: 5px 0; }
</style>
</head><body>

<h3 style="font-size:14px;color:#0f0">Font Rendering Debug</h3>

<div class="test">
  <div class="label">Latin 'A' with CKCut (200px)</div>
  <div class="char" style="font-family:'CKCut',sans-serif">A</div>
</div>

<div class="test">
  <div class="label">Korean with CKCutKR (200px)</div>
  <div class="char" id="krChar" style="font-family:'CKCutKR',sans-serif">가</div>
</div>

<div class="test">
  <div class="label">Korean with system sans-serif (200px) - for comparison</div>
  <div class="char" style="font-family:sans-serif">가</div>
</div>

<div class="test">
  <div class="label">Canvas width measurement</div>
  <canvas id="cv" width="300" height="250"></canvas>
  <div class="info" id="canvasInfo"></div>
</div>

<div class="test">
  <div class="label">Latin 'A' with CKCutKR (should NOT have bars - KR font has no Latin)</div>
  <div class="char" style="font-family:'CKCutKR',sans-serif">A</div>
</div>

<script>
document.fonts.ready.then(() => {
  const info = document.getElementById('canvasInfo');
  const cutLoaded = document.fonts.check('200px "CKCut"');
  const krLoaded = document.fonts.check('200px "CKCutKR"');
  info.innerHTML = 'CKCut: ' + (cutLoaded ? 'OK' : 'FAIL') + ' | CKCutKR: ' + (krLoaded ? 'OK' : 'FAIL') + '<br>';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  ctx.font = '100px "CKCutKR"';
  ctx.fillStyle = '#fff';
  ctx.fillText('\uAC00', 10, 120);
  const w1 = ctx.measureText('\uAC00').width;

  ctx.font = '100px sans-serif';
  ctx.fillStyle = '#f00';
  ctx.fillText('\uAC00', 10, 230);
  const w2 = ctx.measureText('\uAC00').width;

  info.innerHTML += 'CKCutKR width: ' + w1.toFixed(1) + 'px | sans-serif width: ' + w2.toFixed(1) + 'px<br>';
  info.innerHTML += (Math.abs(w1-w2) > 1) ? 'DIFFERENT → custom font IS used' : 'SAME → falling back to system font!';

  let fl = [];
  document.fonts.forEach(function(f){ fl.push(f.family+'('+f.status+')'); });
  info.innerHTML += '<br>Fonts: ' + fl.join(', ');
});
</script>
</body></html>
