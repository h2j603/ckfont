<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font Debug v3</title>
<style>
@font-face { font-family: 'CKCut'; src: url('CKSans-Cut-v4.woff2') format('woff2'); }
@font-face { font-family: 'CKCutKR'; src: url('CKSans-Cut-KR-v4.woff2') format('woff2'); }

body { background: #000; color: #fff; font-family: system-ui; padding: 10px; }
.test { margin: 24px 0; border-bottom: 1px solid #222; padding-bottom: 16px; }
.label { font-size: 11px; color: #666; margin-bottom: 4px; }
.char { font-size: 150px; line-height: 1; }
.info { font-size: 12px; color: #0f0; margin-top: 8px; }
.err { color: #f00; }
</style>
</head><body>

<h3 style="font-size:14px;color:#0f0">Font Debug v3 — VORG removed</h3>

<div class="test">
  <div class="label">1. Latin CKCut (reference)</div>
  <div class="char" style="font-family:'CKCut',sans-serif">AB</div>
  <div class="info" id="s1">...</div>
</div>

<div class="test">
  <div class="label">2. KR CKCutKR (VORG removed from woff2)</div>
  <div class="char" style="font-family:'CKCutKR',sans-serif">가나</div>
  <div class="info" id="s2">...</div>
</div>

<div class="test">
  <div class="label">3. System sans-serif (fallback reference)</div>
  <div class="char" style="font-family:sans-serif">가나</div>
  <div class="info" id="s3">system font</div>
</div>

<div class="test">
  <div class="label">Canvas width comparison</div>
  <canvas id="cv" width="300" height="250"></canvas>
  <div class="info" id="cvInfo">...</div>
</div>

<script>
const tests = [
  { id: 's1', family: 'CKCut', label: 'CKCut' },
  { id: 's2', family: 'CKCutKR', label: 'CKCutKR' },
];

document.fonts.ready.then(() => {
  tests.forEach(t => {
    const el = document.getElementById(t.id);
    let status = 'not found';
    document.fonts.forEach(f => {
      if (f.family === t.family) status = f.status;
    });
    el.textContent = t.label + ': status=' + status;
    el.className = (status === 'loaded') ? 'info' : 'info err';
  });

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const info = document.getElementById('cvInfo');

  ctx.font = '100px "CKCutKR"';
  ctx.fillStyle = '#fff';
  ctx.fillText('\uAC00', 10, 120);
  const w1 = ctx.measureText('\uAC00').width;

  ctx.font = '100px sans-serif';
  ctx.fillStyle = '#f00';
  ctx.fillText('\uAC00', 10, 230);
  const w2 = ctx.measureText('\uAC00').width;

  info.innerHTML = 'CKCutKR: ' + w1.toFixed(1) + 'px | sans-serif: ' + w2.toFixed(1) + 'px<br>';
  info.innerHTML += (Math.abs(w1-w2) > 1) ? 'DIFFERENT → custom font loaded!' : 'SAME → still falling back!';
});
</script>
</body></html>
