<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK Sans Cut</title>
<style>
@font-face {
  font-family: 'CKCut';
  src: url('CKSans-Cut.woff2') format('woff2');
}
@font-face {
  font-family: 'CKCutKR';
  src: url('CKSans-Cut-KR.woff2') format('woff2');
}
@font-face {
  font-family: 'CKCutJP';
  src: url('CKSans-Cut-JP.woff2') format('woff2');
}
@font-face {
  font-family: 'CKCutSC';
  src: url('CKSans-Cut-SC.woff2') format('woff2');
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #f0f0f0;
  font-family: -apple-system, system-ui, sans-serif;
  padding: 20px;
  padding-bottom: 140px;
}

.tag {
  display: inline-block;
  font-size: 10px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border: 1px solid #333;
  padding: 2px 8px;
  border-radius: 3px;
  margin-bottom: 12px;
}

.section { margin-bottom: 48px; }

.sample {
  line-height: 1.05;
  word-break: break-all;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}

.status {
  font-size: 11px;
  margin-top: 8px;
  color: #333;
}
.status.loaded { color: #0c0; }
.status.failed { color: #c00; }

/* Controls */
.controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #151515;
  border-top: 1px solid #2a2a2a;
  padding: 12px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  z-index: 10;
}
.controls label {
  font-size: 10px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.controls input[type=range] {
  width: 100px;
  accent-color: #0f0;
  vertical-align: middle;
}
.controls span {
  font-size: 11px;
  color: #0f0;
  font-variant-numeric: tabular-nums;
  min-width: 28px;
  display: inline-block;
}
</style>
</head>
<body>

<div class="section">
  <div class="tag">Latin</div>
  <div class="sample" id="latin" style="font-family: 'CKCut', sans-serif; font-size: 64px;">
    CONDENSED KIWI
  </div>
  <div class="status" id="statusLatin">loading...</div>
</div>

<div class="section">
  <div class="tag">Korean</div>
  <div class="sample" id="kr" style="font-family: 'CKCutKR', sans-serif; font-size: 64px;">
    응축된 키위 디자인
  </div>
  <div class="status" id="statusKR">loading...</div>
</div>

<div class="section">
  <div class="tag">Japanese</div>
  <div class="sample" id="jp" style="font-family: 'CKCutJP', sans-serif; font-size: 64px;">
    凝縮されたキウイ
  </div>
  <div class="status" id="statusJP">loading...</div>
</div>

<div class="section">
  <div class="tag">Chinese</div>
  <div class="sample" id="sc" style="font-family: 'CKCutSC', sans-serif; font-size: 64px;">
    浓缩奇异果设计
  </div>
  <div class="status" id="statusSC">loading...</div>
</div>

<div class="controls">
  <label>Size <input type="range" id="sz" min="24" max="200" value="64"> <span id="szV">64</span></label>
  <label>Spacing <input type="range" id="ls" min="-10" max="30" value="0"> <span id="lsV">0</span></label>
  <label>Leading <input type="range" id="lh" min="80" max="160" value="105"> <span id="lhV">105</span></label>
</div>

<script>
// Font load detection
const fonts = [
  { family: 'CKCut',   el: 'statusLatin', label: 'Latin' },
  { family: 'CKCutKR', el: 'statusKR',    label: 'KR' },
  { family: 'CKCutJP', el: 'statusJP',    label: 'JP' },
  { family: 'CKCutSC', el: 'statusSC',    label: 'SC' },
];

document.fonts.ready.then(() => {
  fonts.forEach(f => {
    const el = document.getElementById(f.el);
    const loaded = document.fonts.check(`64px "${f.family}"`);
    if (loaded) {
      el.textContent = f.label + ' loaded';
      el.className = 'status loaded';
    } else {
      el.textContent = f.label + ' FAILED to load';
      el.className = 'status failed';
    }
  });
});

// Controls
const targets = ['latin', 'kr', 'jp', 'sc'];
const sz = document.getElementById('sz');
const ls = document.getElementById('ls');
const lh = document.getElementById('lh');

function update() {
  document.getElementById('szV').textContent = sz.value;
  document.getElementById('lsV').textContent = ls.value;
  document.getElementById('lhV').textContent = lh.value;
  targets.forEach(id => {
    const el = document.getElementById(id);
    el.style.fontSize = sz.value + 'px';
    el.style.letterSpacing = ls.value + 'px';
    el.style.lineHeight = lh.value + '%';
  });
}

sz.oninput = ls.oninput = lh.oninput = update;
</script>
</body>
</html>
