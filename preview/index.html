<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK Sans — Preview</title>
<style>
@font-face {
  font-family: 'CK Sans Cut';
  src: url('./CKSans-Cut.woff2') format('woff2'),
       url('./CKSans-Cut.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'CK Sans Cut KR';
  src: url('./CKSans-Cut-KR.woff2') format('woff2'),
       url('./CKSans-Cut-KR.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'CK Sans Cut JP';
  src: url('./CKSans-Cut-JP.woff2') format('woff2'),
       url('./CKSans-Cut-JP.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'CK Sans Cut SC';
  src: url('./CKSans-Cut-SC.woff2') format('woff2'),
       url('./CKSans-Cut-SC.ttf') format('truetype');
  font-display: swap;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#eee; font-family:system-ui,sans-serif; padding:16px; }
h1 { font-size:12px; color:#555; text-transform:uppercase; letter-spacing:.1em; margin-bottom:16px; }

.preview {
  line-height:1.1;
  word-break:break-all;
  margin-bottom:24px;
}

.controls { display:flex; flex-direction:column; gap:10px; max-width:600px; }
.row { display:flex; align-items:center; gap:8px; }
.row label { font-size:11px; color:#888; min-width:56px; text-transform:uppercase; }
.row input[type=range] { flex:1; accent-color:#0f0; }
.row .v { font-size:11px; color:#0f0; min-width:36px; text-align:right; font-variant-numeric:tabular-nums; }
input[type=text] { background:#222; color:#eee; border:1px solid #444; padding:8px; border-radius:4px; font-size:14px; width:100%; }
.sep { height:1px; background:#333; margin:8px 0; }

a { color:#0f0; text-decoration:none; font-size:12px; }
a:hover { text-decoration:underline; }
</style>
</head>
<body>

<h1>CK Sans — Latin</h1>

<div class="preview" id="previewLatin" style="font-size:72px; font-family:'CK Sans Cut',sans-serif;">
  CONDENSED KIWI
</div>

<h1 style="margin-top:32px;">CK Sans — Korean</h1>

<div class="preview" id="previewKR" style="font-size:72px; font-family:'CK Sans Cut KR',sans-serif;">
  응축된 키위 디자인
</div>

<h1 style="margin-top:32px;">CK Sans — Japanese</h1>

<div class="preview" id="previewJP" style="font-size:72px; font-family:'CK Sans Cut JP',sans-serif;">
  凝縮されたキウイ
</div>

<h1 style="margin-top:32px;">CK Sans — Chinese</h1>

<div class="preview" id="previewSC" style="font-size:72px; font-family:'CK Sans Cut SC',sans-serif;">
  浓缩奇异果设计
</div>

<div class="controls">
  <input type="text" id="text" value="CONDENSED KIWI" placeholder="Type here...">
  <div class="sep"></div>

  <div class="row">
    <label>Size</label>
    <input type="range" id="size" min="16" max="200" value="72">
    <span class="v" id="sizeV">72</span>
  </div>
  <div class="row">
    <label>Spacing</label>
    <input type="range" id="spacing" min="-20" max="40" value="0">
    <span class="v" id="spacingV">0</span>
  </div>
  <div class="row">
    <label>Leading</label>
    <input type="range" id="leading" min="80" max="160" value="110">
    <span class="v" id="leadingV">110</span>
  </div>
  <div class="row">
    <label>Color</label>
    <input type="range" id="bright" min="0" max="100" value="93">
    <span class="v" id="brightV">93</span>
  </div>

  <div class="sep"></div>
  <a href="./editor.html">Open Editor →</a>
</div>

<script>
const $ = id => document.getElementById(id);

function update() {
  const txt = $('text').value || 'CK SANS';
  const sz = $('size').value + 'px';
  const ls = $('spacing').value + 'px';
  const lh = $('leading').value + '%';
  const b = Math.round($('bright').value * 2.55);
  const clr = `rgb(${b},${b},${b})`;
  const cjk = new Set(['previewKR','previewJP','previewSC']);
  [$('previewLatin'), $('previewKR'), $('previewJP'), $('previewSC')].forEach(el => {
    if (!el) return;
    if (!cjk.has(el.id)) el.textContent = txt;
    el.style.fontSize = sz;
    el.style.letterSpacing = ls;
    el.style.lineHeight = lh;
    el.style.color = clr;
  });
}

document.querySelectorAll('input').forEach(el => {
  const v = $(el.id + 'V');
  el.oninput = () => { if (v) v.textContent = el.value; update(); };
});

update();
</script>
</body>
</html>
